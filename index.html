<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="description" content="An open-source, text-based cultivation life simulator. Live a life, break through realms, reincarnate.">
<title>Cultivation Life</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="header">
    <div><div id="name"></div><div id="sub"></div></div>
    <div id="meta"></div>
  </div>
  <div id="stats"></div>
  <div id="log"></div>
  <div id="actions"></div>
  <div id="foot">
    <button id="export">Export Save</button>
    <button id="import">Import Save</button>
    <button id="reset">Reset Game</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<div id="death" class="overlay hidden"><div class="card" id="deathCard"></div></div>
<div id="bag" class="overlay hidden"><div class="card wide" id="bagCard"></div></div>

<!-- Order matters. data/bundle.js is generated by `node tools/build.js`. -->
<script src="data/bundle.js"></script>
<script src="js/util.js"></script>
<script src="js/items.js"></script>
<script src="js/techniques.js"></script>
<script src="js/sects.js"></script>
<script src="js/conditions.js"></script>
<script src="js/state.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
